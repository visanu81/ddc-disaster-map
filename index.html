<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동두천시 재난안전지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* === 다크 테마 (기본) === */
  :root {
    --bg: #060a18;
    --bg-grad-from: #0a1530;
    --bg-grad-to: #060a18;
    --bg-card: #0f1730;
    --bg-card-2: #141d3a;
    --border: #1f2a4e;
    --text: #e6ebff;
    --text-dim: #8a96bd;
    --text-sub: #5a6890;
    --accent: #00d4ff;
    --accent-glow: rgba(0, 212, 255, 0.4);
    --fire: #ff3b5c;
    --hospital: #4aa8ff;
    --shelter: #00d68f;
    --danger: #ffaa00;
    --river: #b478ff;
    --highlight-bg: rgba(0, 212, 255, 0.08);
  }

  /* === 라이트 테마 === */
  [data-theme="light"] {
    --bg: #f3f5fa;
    --bg-grad-from: #ffffff;
    --bg-grad-to: #e9eef7;
    --bg-card: #ffffff;
    --bg-card-2: #f5f7fb;
    --border: #dde3ed;
    --text: #1a2138;
    --text-dim: #5a6890;
    --text-sub: #8a96bd;
    --accent: #0077b6;
    --accent-glow: rgba(0, 119, 182, 0.3);
    --fire: #d32f3a;
    --hospital: #0077b6;
    --shelter: #00a672;
    --danger: #e08e00;
    --river: #7a3fd6;
    --highlight-bg: rgba(0, 119, 182, 0.06);
  }

  html, body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-feature-settings: 'tnum';
    transition: background 0.3s, color 0.3s;
    scrollbar-width: none;
    -ms-overflow-style: none;
    height: 100%;
    overflow: hidden;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

  body {
    background: radial-gradient(ellipse at top, var(--bg-grad-from) 0%, var(--bg-grad-to) 70%) fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: linear-gradient(180deg, var(--highlight-bg) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), #0088ff);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px var(--accent-glow);
    font-weight: 900; font-size: 16px;
    color: #fff;
  }
  .title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .updated-at { font-size: 11px; color: var(--text-dim); }
  .updated-at strong { color: var(--text); font-weight: 600; }

  /* 테마 토글 */
  .theme-btn {
    width: 32px; height: 32px;
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ===== 메인 ===== */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* 사이드바 */
  .sidebar {
    width: 300px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s, margin-left 0.25s;
    overflow: hidden;
  }
  .sidebar.collapsed { width: 0; border-right: none; }
  .sidebar-inner {
    padding: 14px 14px 0;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 300px;
  }

  /* 카테고리 칩 그룹 (가로 wrap) */
  .cat-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .cat-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 8px;
    background: var(--bg-card-2);
    border: 1.5px solid var(--border);
    border-radius: 99px;
    cursor: pointer;
    user-select: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    transition: all 0.12s;
    line-height: 1;
  }
  .cat-chip:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }
  .cat-chip.active {
    color: white;
    background: var(--chip-color, var(--accent));
    border-color: var(--chip-color, var(--accent));
    box-shadow: 0 2px 8px var(--chip-color, var(--accent-glow));
  }
  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--chip-color, var(--accent));
    flex-shrink: 0;
  }
  .cat-chip.active .cat-dot { background: rgba(255,255,255,0.9); }
  .cat-emoji {
    font-size: 14px;
    line-height: 1;
    flex-shrink: 0;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji',
                 'Pretendard Variable', sans-serif;
  }
  .cat-count {
    font-size: 10px;
    color: var(--text-sub);
    background: var(--bg-card);
    padding: 1px 7px;
    border-radius: 99px;
    font-weight: 700;
    min-width: 18px;
    text-align: center;
    margin-left: 2px;
  }
  .cat-chip.active .cat-count {
    background: rgba(255,255,255,0.25);
    color: white;
  }

  /* 검색창 */
  .search-bar {
    position: relative;
    margin-bottom: 10px;
  }
  .search-bar input {
    width: 100%;
    padding: 9px 30px 9px 32px;
    background: var(--bg-card-2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-sub); }
  .search-bar::before {
    content: '';
    position: absolute;
    left: 11px; top: 50%;
    width: 13px; height: 13px;
    margin-top: -7px;
    border: 1.7px solid var(--text-sub);
    border-radius: 50%;
    pointer-events: none;
  }
  .search-bar::after {
    content: '';
    position: absolute;
    left: 21px; top: 50%;
    width: 6px; height: 1.7px;
    background: var(--text-sub);
    transform: rotate(45deg);
    margin-top: 3px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    background: transparent;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 14px;
    display: none;
    border-radius: 50%;
  }
  .search-clear:hover { color: var(--text); background: var(--bg-card); }
  .search-bar.has-text .search-clear { display: flex; align-items: center; justify-content: center; }

  /* 목록 헤더 */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 4px 2px 8px;
  }
  .list-header .label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .list-header .count {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }

  /* 장소 목록 (사이드바 남은 영역 다 사용) */
  .place-list {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    padding-bottom: 12px;
  }
  .place-list::-webkit-scrollbar { width: 4px; }
  .place-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .place-item {
    padding: 7px 10px;
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .place-item:hover {
    border-color: var(--accent);
    background: var(--highlight-bg);
  }
  .place-name {
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .place-name .pdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .place-addr {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
    padding-left: 13px;
    line-height: 1.4;
  }
  .empty-hint {
    padding: 24px 14px;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    line-height: 1.6;
  }

  /* 사이드바 토글 버튼 (지도 좌상단) */
  .sidebar-toggle {
    position: absolute;
    top: 14px; left: 14px;
    width: 34px; height: 34px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 5;
    transition: all 0.15s;
    font-size: 14px;
    font-weight: 700;
  }
  .sidebar-toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* ===== 지도 ===== */
  .map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* 마커: 카테고리 이모지 그대로 표시 (핀 배경 없음, 더 깔끔) */
  .map-marker {
    width: 32px;
    height: 32px;
    font-size: 26px;
    line-height: 32px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    transition: transform 0.12s ease-out;
  }
  .map-marker:hover { transform: scale(1.2); }

  /* 정보창 (InfoWindow 내부 컨텐츠) */
  .info-window {
    min-width: 220px; max-width: 320px;
    padding: 12px 14px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    color: #1a2138;
  }
  .info-cat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px; font-weight: 700;
    padding: 3px 9px 3px 7px;
    border-radius: 10px;
    color: white;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .info-cat-icon {
    font-size: 12px;
    line-height: 1;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }
  .info-name { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .info-row {
    font-size: 12px;
    color: #4a5570;
    margin-top: 3px;
    display: flex;
    gap: 6px;
  }
  .info-row strong { color: #2a3148; font-weight: 600; min-width: 36px; }
  .info-row a { color: #0077b6; text-decoration: none; }
  .info-row a:hover { text-decoration: underline; }

  /* 모바일 */
  @media (max-width: 720px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
    .sidebar-inner { min-width: 0; padding: 12px 12px 0; }
    .sidebar.collapsed { max-height: 0; }
    .sidebar-toggle { top: auto; bottom: 14px; left: 14px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo-mark">D</div>
    <div>
      <div class="title">동두천시 재난안전지도</div>
      <div class="subtitle">소방서 · 병원 · 대피소 · 위험지역 · 하천관측소</div>
    </div>
  </div>
  <div class="header-right">
    <div class="updated-at">갱신 <strong id="updated-at">-</strong></div>
    <button class="theme-btn" id="theme-toggle" title="테마 전환">🌓</button>
  </div>
</header>

<main class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="cat-chips" id="cat-chips"></div>

      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="장소 이름·주소 검색" autocomplete="off">
        <button class="search-clear" id="search-clear" title="지우기">✕</button>
      </div>

      <div class="list-header">
        <span class="label">장소 목록</span>
        <span class="count"><span id="place-count">0</span>개</span>
      </div>
      <div class="place-list" id="place-list"></div>
    </div>
  </aside>

  <div class="map-wrap">
    <button class="sidebar-toggle" id="sidebar-toggle" title="사이드바 접기/펼치기">☰</button>
    <div id="map"></div>
  </div>
</main>

<!-- 데이터 (별도 파일에서 로드) -->
<script src="data.js"></script>

<!-- 네이버맵 v3 SDK -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=nk07ypv156"></script>

<script>
/* ============================================================
   동두천시 재난안전지도 — 클라이언트 로직
   ============================================================ */

const DDC_CENTER = { lat: 37.9034, lng: 127.0606 }; // 동두천시청 기준
const DEFAULT_ZOOM = 13;

// 카테고리별 아이콘 (마커·칩·목록에 공통 사용)
// 시트에 없는 새 카테고리가 들어와도 안전하게 기본 아이콘 fallback.
const CATEGORY_ICONS = {
  '소방서':         '🚒',
  '구급함':         '⛑️',
  '산악위치표지판': '⛰️',
  '병원':           '🏥',
  '의료기관':       '🏥',
  '대피소':         '🏠',
  '위험지역':       '⚠️',
  '하천 관측소':    '🌊',
  '하천관측소':     '🌊',
  '헬기장':         '🚁',
  '취약가구':       '👥',
  '소화전':         '🧯',
  '비상급수':       '🚰',
};
const DEFAULT_ICON = '📍';
function iconFor(catKey) {
  return CATEGORY_ICONS[catKey] || DEFAULT_ICON;
}

// 데이터 로드 (data.js 가 window.DDC_DATA 정의)
const DATA = window.DDC_DATA || { updatedAt: '-', categories: {} };
document.getElementById('updated-at').textContent = DATA.updatedAt || '-';

// 카테고리 상태
const CATS = DATA.categories || {};
let activeCategory = null;   // null = 전체 보기, 또는 카테고리 키
let searchQuery = '';

/* ----- 테마 토글 ----- */
const savedTheme = localStorage.getItem('ddc-theme');
if (savedTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
document.getElementById('theme-toggle').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? null : 'light';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('ddc-theme', next || 'dark');
};

/* ----- 네이버맵 초기화 ----- */
let map;
const markers = {}; // catKey -> [naver.maps.Marker, ...]
let openInfoWindow = null;

function initMap() {
  if (typeof naver === 'undefined' || !naver.maps) {
    document.getElementById('map').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--text-dim);">' +
      '네이버맵 SDK 로드 실패. Client ID 또는 네트워크 확인 필요.</div>';
    return;
  }

  map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(DDC_CENTER.lat, DDC_CENTER.lng),
    zoom: DEFAULT_ZOOM,
    zoomControl: true,
    zoomControlOptions: { position: naver.maps.Position.TOP_LEFT },
    mapTypeControl: false,
  });

  // 카테고리 UI + 마커 렌더
  renderChips();
  renderAllMarkers();
  applyFilter();   // 초기 상태: 전체 보기
  bindSearch();
  bindSidebarToggle();
}

/* ----- 카테고리 칩 ----- */
function renderChips() {
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = '';

  const total = Object.values(CATS).reduce((s, c) => s + (c.items || []).length, 0);

  // 전체 칩
  const all = document.createElement('button');
  all.className = 'cat-chip active';
  all.dataset.cat = '';
  all.innerHTML =
    '<span class="cat-name">전체</span>' +
    '<span class="cat-count">' + total + '</span>';
  all.onclick = () => setActiveCategory(null);
  wrap.appendChild(all);

  // 카테고리별 칩
  Object.entries(CATS).forEach(([key, cat]) => {
    const count = (cat.items || []).length;
    const chip = document.createElement('button');
    chip.className = 'cat-chip';
    chip.dataset.cat = key;
    chip.style.setProperty('--chip-color', cat.color);
    chip.innerHTML =
      '<span class="cat-emoji">' + iconFor(key) + '</span>' +
      '<span class="cat-name">' + escapeHtml(cat.label || key) + '</span>' +
      '<span class="cat-count">' + count + '</span>';
    chip.onclick = () => setActiveCategory(key);
    wrap.appendChild(chip);
  });
}

function setActiveCategory(key) {
  activeCategory = key;
  document.querySelectorAll('.cat-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === (key || ''));
  });
  applyFilter();
}

/* ----- 검색 ----- */
function bindSearch() {
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');
  const bar = document.getElementById('search-bar');
  input.addEventListener('input', e => {
    searchQuery = e.target.value.trim().toLowerCase();
    bar.classList.toggle('has-text', !!searchQuery);
    applyFilter();
  });
  clear.addEventListener('click', () => {
    input.value = '';
    searchQuery = '';
    bar.classList.remove('has-text');
    applyFilter();
    input.focus();
  });
}

/* ----- 사이드바 접기/펼치기 ----- */
function bindSidebarToggle() {
  document.getElementById('sidebar-toggle').onclick = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
    // 지도 리사이즈 트리거
    setTimeout(() => { if (map) naver.maps.Event.trigger(map, 'resize'); }, 280);
  };
}

/* ----- 필터 적용 (카테고리 + 검색) ----- */
function applyFilter() {
  if (openInfoWindow) { openInfoWindow.close(); openInfoWindow = null; }

  // 마커 표시/숨김
  Object.entries(markers).forEach(([key, list]) => {
    list.forEach(rec => {
      const showByCat = !activeCategory || activeCategory === key;
      const showBySearch = !searchQuery || matchSearch(rec.item, rec.cat);
      rec.marker.setMap(showByCat && showBySearch ? map : null);
    });
  });

  renderPlaceList();
}

function matchSearch(item, cat) {
  const q = searchQuery;
  if (!q) return true;
  const fields = [item.name, item.address, item.type, item.note, cat.label];
  return fields.some(f => f && String(f).toLowerCase().includes(q));
}

/* ----- 마커 렌더 ----- */
function renderAllMarkers() {
  Object.entries(CATS).forEach(([key, cat]) => {
    markers[key] = [];
    (cat.items || []).forEach(item => {
      const rec = createMarker(key, cat, item);
      if (rec) markers[key].push(rec);
    });
  });
}

function createMarker(catKey, cat, item) {
  if (typeof item.lat !== 'number' || typeof item.lng !== 'number') return null;
  const icon = iconFor(catKey);
  const marker = new naver.maps.Marker({
    position: new naver.maps.LatLng(item.lat, item.lng),
    map: map,
    icon: {
      content: '<div class="map-marker" title="' + escapeHtml(item.name) + '">' + icon + '</div>',
      anchor: new naver.maps.Point(16, 16),   // 32×32 마커 박스의 중앙이 좌표를 가리킴
    },
    title: item.name,
  });
  const infoHtml = buildInfoWindowHtml(catKey, cat, item);
  const info = new naver.maps.InfoWindow({
    content: infoHtml,
    borderWidth: 0,
    backgroundColor: '#fff',
    anchorSize: new naver.maps.Size(12, 10),
    pixelOffset: new naver.maps.Point(0, -8),
  });
  naver.maps.Event.addListener(marker, 'click', () => {
    if (openInfoWindow) openInfoWindow.close();
    info.open(map, marker);
    openInfoWindow = info;
  });
  return { marker, info, item, cat };
}

function buildInfoWindowHtml(catKey, cat, item) {
  const rows = [];
  if (item.address) rows.push(row('주소', escapeHtml(item.address)));
  if (item.phone) rows.push(row('전화', '<a href="tel:' + item.phone.replace(/[^0-9]/g,'') + '">' + escapeHtml(item.phone) + '</a>'));
  if (item.type) rows.push(row('종류', escapeHtml(item.type)));
  if (item.capacity) rows.push(row('수용', escapeHtml(String(item.capacity)) + '명'));
  if (item.level) rows.push(row('등급', escapeHtml(item.level)));
  if (item.note) rows.push(row('비고', escapeHtml(item.note)));

  const catLabel = escapeHtml(cat.label || catKey);
  return (
    '<div class="info-window">' +
      '<span class="info-cat" style="background:' + cat.color + '">' +
        '<span class="info-cat-icon">' + iconFor(catKey) + '</span>' + catLabel +
      '</span>' +
      '<div class="info-name">' + escapeHtml(item.name) + '</div>' +
      rows.join('') +
    '</div>'
  );
  function row(label, val) {
    return '<div class="info-row"><strong>' + label + '</strong><span>' + val + '</span></div>';
  }
}

/* ----- 사이드바 장소 목록 (카테고리·검색 필터 적용) ----- */
function renderPlaceList() {
  const wrap = document.getElementById('place-list');
  wrap.innerHTML = '';

  const filtered = [];
  Object.entries(CATS).forEach(([key, cat]) => {
    if (activeCategory && key !== activeCategory) return;
    (cat.items || []).forEach(it => {
      if (typeof it.lat !== 'number') return;
      if (!matchSearch(it, cat)) return;
      filtered.push({ catKey: key, cat, item: it });
    });
  });

  document.getElementById('place-count').textContent = filtered.length;

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-hint">조건에 맞는 장소가 없습니다.</div>';
    return;
  }

  filtered.forEach(({ catKey, cat, item }) => {
    const el = document.createElement('div');
    el.className = 'place-item';
    el.innerHTML =
      '<div class="place-name">' +
        '<span class="pdot" style="background:' + cat.color + '"></span>' +
        escapeHtml(item.name) +
      '</div>' +
      (item.address ? '<div class="place-addr">' + escapeHtml(item.address) + '</div>' : '');
    el.onclick = () => {
      map.setCenter(new naver.maps.LatLng(item.lat, item.lng));
      map.setZoom(Math.max(map.getZoom(), 15));
      const rec = (markers[catKey] || []).find(r => r.item === item);
      if (rec) {
        if (openInfoWindow) openInfoWindow.close();
        rec.info.open(map, rec.marker);
        openInfoWindow = rec.info;
      }
    };
    wrap.appendChild(el);
  });
}

/* ----- 유틸 ----- */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ----- 부팅 ----- */
window.addEventListener('load', initMap);
</script>
