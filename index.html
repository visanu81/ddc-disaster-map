<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동두천시 재난안전지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* === 다크 테마 (기본) === */
  :root {
    --bg: #060a18;
    --bg-grad-from: #0a1530;
    --bg-grad-to: #060a18;
    --bg-card: #0f1730;
    --bg-card-2: #141d3a;
    --border: #1f2a4e;
    --text: #e6ebff;
    --text-dim: #8a96bd;
    --text-sub: #5a6890;
    --accent: #00d4ff;
    --accent-glow: rgba(0, 212, 255, 0.4);
    --fire: #ff3b5c;
    --hospital: #4aa8ff;
    --shelter: #00d68f;
    --danger: #ffaa00;
    --river: #b478ff;
    --highlight-bg: rgba(0, 212, 255, 0.08);
  }

  /* === 라이트 테마 === */
  [data-theme="light"] {
    --bg: #f3f5fa;
    --bg-grad-from: #ffffff;
    --bg-grad-to: #e9eef7;
    --bg-card: #ffffff;
    --bg-card-2: #f5f7fb;
    --border: #dde3ed;
    --text: #1a2138;
    --text-dim: #5a6890;
    --text-sub: #8a96bd;
    --accent: #0077b6;
    --accent-glow: rgba(0, 119, 182, 0.3);
    --fire: #d32f3a;
    --hospital: #0077b6;
    --shelter: #00a672;
    --danger: #e08e00;
    --river: #7a3fd6;
    --highlight-bg: rgba(0, 119, 182, 0.06);
  }

  html, body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-feature-settings: 'tnum';
    transition: background 0.3s, color 0.3s;
    scrollbar-width: none;
    -ms-overflow-style: none;
    height: 100%;
    overflow: hidden;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

  body {
    background: radial-gradient(ellipse at top, var(--bg-grad-from) 0%, var(--bg-grad-to) 70%) fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: linear-gradient(180deg, var(--highlight-bg) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), #0088ff);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px var(--accent-glow);
    font-weight: 900; font-size: 16px;
    color: #fff;
  }
  .title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .updated-at { font-size: 11px; color: var(--text-dim); }
  .updated-at strong { color: var(--text); font-weight: 600; }

  /* 테마 토글 */
  .theme-btn {
    width: 32px; height: 32px;
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* GPS 좌표 표시 (헤더) */
  .coord-display {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
    font-size: 11.5px;
    font-weight: 700;
    font-feature-settings: 'tnum';
    transition: all 0.15s;
  }
  .coord-display.visible { display: inline-flex; }
  .coord-display:hover { border-color: var(--accent); color: var(--accent); }
  .coord-display.copied { background: var(--safe, #00d68f); color: white; border-color: transparent; }
  .coord-display .ico { font-size: 10px; opacity: 0.7; }

  /* 119 직통 전화 버튼 */
  .sos-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: #dc2626;
    color: white !important;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 6px rgba(220,38,38,0.35);
    transition: transform 0.12s;
  }
  .sos-btn:hover { transform: scale(1.04); }
  .sos-btn .ico { font-size: 13px; }

  /* 조난자 안내 배너 */
  .rescue-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: linear-gradient(90deg, #dc2626, #f59e0b);
    color: white;
    font-weight: 700;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .rescue-banner.hidden { display: none; }
  .rescue-banner .msg {
    flex: 1;
    font-size: 13px;
    letter-spacing: -0.2px;
  }
  .rescue-banner .msg small {
    display: block;
    font-size: 11px;
    font-weight: 500;
    opacity: 0.92;
    margin-top: 2px;
  }
  .rescue-btn {
    background: white;
    color: #b91c1c;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.1px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .rescue-btn:hover { background: #fef3c7; }
  .rescue-close {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  .rescue-close:hover { background: rgba(255,255,255,0.35); }
  @media (max-width: 600px) {
    .rescue-banner { padding: 9px 12px; flex-wrap: wrap; }
    .rescue-banner .msg { flex-basis: 100%; font-size: 12px; }
  }

  /* 토스트 알림 (좌표 복사 등) */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #111827;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 9999;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 메인 ===== */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* 사이드바 */
  .sidebar {
    width: 300px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s, margin-left 0.25s;
    overflow: hidden;
  }
  .sidebar.collapsed { width: 0; border-right: none; }
  .sidebar-inner {
    padding: 14px 14px 0;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 300px;
  }

  /* 카테고리 칩 그룹 (가로 wrap) */
  .cat-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .cat-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 8px;
    background: var(--bg-card-2);
    border: 1.5px solid var(--border);
    border-radius: 99px;
    cursor: pointer;
    user-select: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    transition: all 0.12s;
    line-height: 1;
  }
  .cat-chip:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }
  .cat-chip.active {
    color: white;
    background: var(--chip-color, var(--accent));
    border-color: var(--chip-color, var(--accent));
    box-shadow: 0 2px 8px var(--chip-color, var(--accent-glow));
  }
  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--chip-color, var(--accent));
    flex-shrink: 0;
  }
  .cat-chip.active .cat-dot { background: rgba(255,255,255,0.9); }
  .cat-emoji {
    font-size: 14px;
    line-height: 1;
    flex-shrink: 0;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji',
                 'Pretendard Variable', sans-serif;
  }
  .cat-count {
    font-size: 10px;
    color: var(--text-sub);
    background: var(--bg-card);
    padding: 1px 7px;
    border-radius: 99px;
    font-weight: 700;
    min-width: 18px;
    text-align: center;
    margin-left: 2px;
  }
  .cat-chip.active .cat-count {
    background: rgba(255,255,255,0.25);
    color: white;
  }

  /* 검색창 */
  .search-bar {
    position: relative;
    margin-bottom: 10px;
  }
  .search-bar input {
    width: 100%;
    padding: 9px 30px 9px 32px;
    background: var(--bg-card-2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-sub); }
  .search-bar::before {
    content: '';
    position: absolute;
    left: 11px; top: 50%;
    width: 13px; height: 13px;
    margin-top: -7px;
    border: 1.7px solid var(--text-sub);
    border-radius: 50%;
    pointer-events: none;
  }
  .search-bar::after {
    content: '';
    position: absolute;
    left: 21px; top: 50%;
    width: 6px; height: 1.7px;
    background: var(--text-sub);
    transform: rotate(45deg);
    margin-top: 3px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    background: transparent;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 14px;
    display: none;
    border-radius: 50%;
  }
  .search-clear:hover { color: var(--text); background: var(--bg-card); }
  .search-bar.has-text .search-clear { display: flex; align-items: center; justify-content: center; }

  /* 목록 헤더 (클릭하면 장소 목록 자체를 접기/펼치기) */
  .list-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 2px 8px;
    padding: 4px 2px;
    cursor: pointer;
    user-select: none;
    border-radius: 4px;
  }
  .list-header:hover { background: var(--highlight-bg); }
  .list-header .label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex: 1;
  }
  .list-header .count {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .list-toggle {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.18s;
    margin-left: 2px;
  }
  .list-header.collapsed .list-toggle { transform: rotate(-90deg); }
  .place-list.collapsed { display: none; }

  /* 장소 목록 (사이드바 남은 영역 다 사용) */
  .place-list {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    padding-bottom: 12px;
  }
  .place-list::-webkit-scrollbar { width: 4px; }
  .place-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .place-item {
    padding: 7px 10px;
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .place-item:hover {
    border-color: var(--accent);
    background: var(--highlight-bg);
  }
  .place-name {
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .place-name .pdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .place-addr {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
    padding-left: 13px;
    line-height: 1.4;
  }
  .empty-hint {
    padding: 24px 14px;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    line-height: 1.6;
  }

  /* 사이드바 푸터 (제작자) */
  .sidebar-footer {
    margin-top: 10px;
    padding: 10px 4px 12px;
    border-top: 1px solid var(--border);
    font-size: 10.5px;
    color: var(--text-sub);
    text-align: center;
    letter-spacing: 0.2px;
    flex-shrink: 0;
  }
  .sidebar-footer strong {
    color: var(--text-dim);
    font-weight: 700;
  }

  /* region 그룹 헤더 (카테고리 선택 + region 컬럼 있을 때만 표시) */
  .group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-top: 8px;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    user-select: none;
  }
  .group-header:first-of-type { margin-top: 0; }
  .group-header:hover { color: var(--accent); border-color: var(--accent); }
  .group-name { flex: 1; letter-spacing: 0.2px; }
  .group-count {
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg-card);
    padding: 1px 7px;
    border-radius: 99px;
    font-weight: 700;
  }
  .group-toggle {
    transition: transform 0.18s;
    font-size: 10px;
    color: var(--text-dim);
    display: inline-block;
  }
  .group-header.collapsed .group-toggle { transform: rotate(-90deg); }
  .group-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px 0 2px;
  }
  .group-body.collapsed { display: none; }

  /* 지도 위 도구 모음 (좌상단) */
  .map-tools {
    position: absolute;
    top: 14px; left: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .map-tool-btn {
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    white-space: nowrap;
  }
  .map-tool-btn:hover { color: var(--accent); border-color: var(--accent); }
  .map-tool-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 10px var(--accent-glow);
  }
  .map-tool-btn.loading { opacity: 0.55; pointer-events: none; }
  .map-tool-btn.icon-btn { padding: 0; width: 34px; }
  .map-tool-btn svg { display: block; }

  /* 내 위치 마커 (조준점 / crosshair) */
  .user-loc-marker {
    width: 32px; height: 32px;
    position: relative;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .user-loc-marker svg { display: block; }
  .user-loc-marker::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: rgba(220,38,38,0.28);
    animation: pulse-loc 1.8s ease-out infinite;
    z-index: -1;
  }
  @keyframes pulse-loc {
    0%   { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  /* 장소 목록에서 거리 표시 */
  .place-distance {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 700;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 99px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .place-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== 지도 ===== */
  .map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* 마커: 카테고리별 SVG (소방서·구급함·산악표지판) 또는 이모지 fallback */
  .map-marker {
    width: 32px;
    height: 32px;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    transition: transform 0.12s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .map-marker:hover { transform: scale(1.2); }
  .map-marker svg { display: block; }
  .map-marker-emoji {
    font-size: 26px;
    line-height: 1;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }

  /* 클러스터(여러 마커 묶음) */
  .cluster-marker {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.88);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    border: 2.5px solid white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease-out;
  }
  .cluster-marker:hover { transform: scale(1.12); }
  .cluster-marker.size-l { width: 44px; height: 44px; font-size: 14px; }
  .cluster-marker.size-xl { width: 52px; height: 52px; font-size: 15px; background: rgba(220,38,38,0.92); }

  /* 정보창 (InfoWindow 내부 컨텐츠) */
  .info-window {
    min-width: 220px; max-width: 320px;
    padding: 12px 14px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    color: #1a2138;
  }
  .info-cat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px; font-weight: 700;
    padding: 3px 9px 3px 7px;
    border-radius: 10px;
    color: white;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .info-cat-icon {
    font-size: 12px;
    line-height: 1;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }
  .info-name { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .info-row {
    font-size: 12px;
    color: #4a5570;
    margin-top: 3px;
    display: flex;
    gap: 6px;
  }
  .info-row strong { color: #2a3148; font-weight: 600; min-width: 36px; }
  .info-row a { color: #0077b6; text-decoration: none; }
  .info-row a:hover { text-decoration: underline; }

  /* 길찾기 버튼들 (InfoWindow 하단) */
  .info-nav {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #e5e7eb;
  }
  .info-nav-btn {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none !important;
    color: white !important;
    letter-spacing: -0.2px;
    line-height: 1.2;
  }
  .info-nav-btn:hover { filter: brightness(0.95); }
  .info-nav-btn.nav-naver  { background: #03c75a; }
  .info-nav-btn.nav-kakao  { background: #fee500; color: #381f1f !important; }
  .info-nav-btn.nav-tmap   { background: #ed174c; }
  .info-share-btn {
    margin-top: 6px;
    width: 100%;
    padding: 7px 8px;
    background: transparent;
    border: 1px solid #d1d5db;
    border-radius: 6px;

<!-- 네이버맵 v3 SDK -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=nk07ypv156"></script>

<script>
/* ============================================================
   동두천시 재난안전지도 — 클라이언트 로직
   ============================================================ */

// 기본 중심 좌표 — 동두천소방서. 데이터(data.js)에 동두천소방서가 있으면 그 좌표를 자동 사용.
const DDC_HQ_FALLBACK = { lat: 37.892294, lng: 127.047618 }; // 동두천소방서 (지행로 6)
const DEFAULT_ZOOM = 13;

function getHomeCenter() {
  const fire = (window.DDC_DATA && window.DDC_DATA.categories && window.DDC_DATA.categories['소방서']);
  if (fire && Array.isArray(fire.items)) {
    const main = fire.items.find(it => it.name === '동두천소방서');
    if (main && typeof main.lat === 'number' && typeof main.lng === 'number') {
      return { lat: main.lat, lng: main.lng };
    }
  }
  return DDC_HQ_FALLBACK;
}
const DDC_CENTER = getHomeCenter();

// 카테고리별 아이콘 — 마커는 SVG 우선, 사이드바 칩·InfoWindow 배지는 이모지 fallback.
// 시트에 없는 새 카테고리가 들어와도 기본 아이콘으로 안전 fallback.
const CATEGORY_ICONS = {
  '소방서':         '🚒',
  '구급함':         '⛑️',
  '산악위치표지판': '⛰️',
  '병원':           '🏥',
  '의료기관':       '🏥',
  '대피소':         '🏠',
  '위험지역':       '⚠️',
  '하천 관측소':    '🌊',
  '하천관측소':     '🌊',
  '헬기장':         '🚁',
  '취약가구':       '👥',
  '소화전':         '🧯',
  '비상급수':       '🚰',
};
const DEFAULT_ICON = '📍';
function iconFor(catKey) {
  return CATEGORY_ICONS[catKey] || DEFAULT_ICON;
}

// 마커용 SVG — 단순한 도형. OS·브라우저 무관하게 동일하게 보이려면 SVG 가 정답.
const CATEGORY_SVGS = {
  // 소방서: 빨간 집 (지붕 + 본체 + 119)
  '소방서':
    '<svg viewBox="0 0 32 32" width="32" height="32" aria-label="소방서">' +
      '<polygon points="16,3 30,15 2,15" fill="#dc2626"/>' +
      '<rect x="5" y="15" width="22" height="14" fill="#dc2626"/>' +
      '<rect x="5" y="15" width="22" height="14" fill="none" stroke="white" stroke-width="1"/>' +
      '<text x="16" y="25" fill="white" font-size="9" font-weight="800" font-family="Pretendard, sans-serif" text-anchor="middle">119</text>' +
    '</svg>',
  // 구급함: 빨간 사각형 + 흰 십자가 (적십자)
  '구급함':
    '<svg viewBox="0 0 32 32" width="32" height="32" aria-label="구급함">' +
      '<rect x="2" y="2" width="28" height="28" rx="5" fill="#dc2626" stroke="white" stroke-width="1.5"/>' +
      '<rect x="13.5" y="7" width="5" height="18" fill="white"/>' +
      '<rect x="7" y="13.5" width="18" height="5" fill="white"/>' +
    '</svg>',
  // 산악위치표지판: 갈색 ▲ 봉우리 (미니멀)
  '산악위치표지판':
    '<svg viewBox="0 0 32 32" width="32" height="32" aria-label="산악위치표지판">' +
      '<polygon points="16,5 28,26 4,26" fill="#78350f" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>' +
    '</svg>',
};
function svgFor(catKey) {
  return CATEGORY_SVGS[catKey] || null;
}

// 데이터 로드 (data.js 가 window.DDC_DATA 정의)
const DATA = window.DDC_DATA || { updatedAt: '-', categories: {} };
document.getElementById('updated-at').textContent = DATA.updatedAt || '-';

// 카테고리 상태
const CATS = DATA.categories || {};
let activeCategory = null;   // null = 전체 보기, 또는 카테고리 키
let searchQuery = '';

/* ----- 테마 토글 ----- */
const savedTheme = localStorage.getItem('ddc-theme');
if (savedTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
document.getElementById('theme-toggle').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? null : 'light';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('ddc-theme', next || 'dark');
};

/* ----- 네이버맵 초기화 ----- */
let map;
let cadastralLayer;
const markers = {}; // catKey -> [{marker, info, item, cat}, ...]
let openInfoWindow = null;
let clusterMarkers = [];   // 줌 아웃 시 묶음 마커들
let zoomChangeListener = null;

// 사용자 현재 위치 상태
let userLatLng = null;        // { lat, lng } or null
let userMarker = null;
let userCircle = null;
let userWatchId = null;       // 모바일 등 연속 위치 갱신용 (선택적으로 사용)

function initMap() {
  if (typeof naver === 'undefined' || !naver.maps) {
    document.getElementById('map').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--text-dim);">' +
      '네이버맵 SDK 로드 실패. Client ID 또는 네트워크 확인 필요.</div>';
    return;
  }

  map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(DDC_CENTER.lat, DDC_CENTER.lng),
    zoom: DEFAULT_ZOOM,
    // 일반/위성/지형/하이브리드 모드 토글 (우상단)
    mapTypeControl: true,
    mapTypeControlOptions: {
      position: naver.maps.Position.TOP_RIGHT,
      style: naver.maps.MapTypeControlStyle.BUTTON,
      mapTypeIds: [
        naver.maps.MapTypeId.NORMAL,
        naver.maps.MapTypeId.TERRAIN,
        naver.maps.MapTypeId.SATELLITE,
        naver.maps.MapTypeId.HYBRID,
      ],
    },
    // 줌 컨트롤 (우측 중앙)
    zoomControl: true,
    zoomControlOptions: {
      position: naver.maps.Position.RIGHT_CENTER,
      style: naver.maps.ZoomControlStyle.SMALL,
    },
    // 축척 (좌하단)
    scaleControl: true,
    scaleControlOptions: { position: naver.maps.Position.BOTTOM_LEFT },
    // 네이버 로고 (의무 — 우하단)
    logoControl: true,
    logoControlOptions: { position: naver.maps.Position.BOTTOM_RIGHT },
  });

  // 지적편집도 레이어 (토글 가능, 기본은 OFF)
  cadastralLayer = new naver.maps.CadastralLayer();

  // 빈 지도(마커/InfoWindow 아닌 곳) 클릭 시 열린 InfoWindow 닫기
  naver.maps.Event.addListener(map, 'click', () => {
    if (openInfoWindow) {
      openInfoWindow.close();
      openInfoWindow = null;
    }
  });

  // 줌 변경시 클러스터링 다시 계산
  zoomChangeListener = naver.maps.Event.addListener(map, 'zoom_changed', recomputeClusters);

  // 카테고리 UI + 마커 렌더
  renderChips();
  renderAllMarkers();
  applyFilter();
  bindSearch();
  bindMapTools();
  bindListHeader();
  bindRescueBanner();
  bindCoordDisplay();
  handleUrlParams();
}

/* ----- 장소 목록 접기/펼치기 (헤더 클릭) ----- */
function bindListHeader() {
  const header = document.getElementById('list-header');
  const list = document.getElementById('place-list');
  // localStorage 저장 상태 복원
  if (localStorage.getItem('ddc-placelist-collapsed') === '1') {
    header.classList.add('collapsed');
    list.classList.add('collapsed');
  }
  header.onclick = () => {
    const willCollapse = !header.classList.contains('collapsed');
    header.classList.toggle('collapsed', willCollapse);
    list.classList.toggle('collapsed', willCollapse);
    localStorage.setItem('ddc-placelist-collapsed', willCollapse ? '1' : '0');
  };
}

/* ----- 카테고리 칩 ----- */
function renderChips() {
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = '';

  const total = Object.values(CATS).reduce((s, c) => s + (c.items || []).length, 0);

  // 전체 칩
  const all = document.createElement('button');
  all.className = 'cat-chip active';
  all.dataset.cat = '';
  all.innerHTML =
    '<span class="cat-name">전체</span>' +
    '<span class="cat-count">' + total + '</span>';
  all.onclick = () => setActiveCategory(null);
  wrap.appendChild(all);

  // 카테고리별 칩
  Object.entries(CATS).forEach(([key, cat]) => {
    const count = (cat.items || []).length;
    const chip = document.createElement('button');
    chip.className = 'cat-chip';
    chip.dataset.cat = key;
    chip.style.setProperty('--chip-color', cat.color);
    chip.innerHTML =
      '<span class="cat-emoji">' + iconFor(key) + '</span>' +
      '<span class="cat-name">' + escapeHtml(cat.label || key) + '</span>' +
      '<span class="cat-count">' + count + '</span>';
    chip.onclick = () => setActiveCategory(key);
    wrap.appendChild(chip);
  });
}

function setActiveCategory(key) {
  activeCategory = key;
  document.querySelectorAll('.cat-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === (key || ''));
  });
  applyFilter();
}

/* ----- 검색 ----- */
function bindSearch() {
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');
  const bar = document.getElementById('search-bar');
  input.addEventListener('input', e => {
    searchQuery = e.target.value.trim().toLowerCase();
    bar.classList.toggle('has-text', !!searchQuery);
    applyFilter();
  });
  clear.addEventListener('click', () => {
    input.value = '';
    searchQuery = '';
    bar.classList.remove('has-text');
    applyFilter();
    input.focus();
  });
}

/* ----- 지도 좌상단 도구 모음 ----- */
function bindMapTools() {
  // 사이드바 접기/펼치기
  document.getElementById('sidebar-toggle').onclick = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
    setTimeout(() => { if (map) naver.maps.Event.trigger(map, 'resize'); }, 280);
  };

  // 지적편집도 ON/OFF
  const cBtn = document.getElementById('cadastral-toggle');
  cBtn.onclick = () => {
    const on = cadastralLayer.getMap() == null;
    cadastralLayer.setMap(on ? map : null);
    cBtn.classList.toggle('active', on);
  };

  // 동두천 시청 기준 위치·줌 복귀
  document.getElementById('recenter-btn').onclick = () => {
    map.setCenter(new naver.maps.LatLng(DDC_CENTER.lat, DDC_CENTER.lng));
    map.setZoom(DEFAULT_ZOOM);
  };

  // 내 현재 위치
  document.getElementById('locate-btn').onclick = requestUserLocation;
}

/* ----- 사용자 위치 / 거리 계산 ----- */
function requestUserLocation() {
  const btn = document.getElementById('locate-btn');
  if (!navigator.geolocation) {
    alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
    return;
  }
  btn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.classList.remove('loading');
      btn.classList.add('active');
      setUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    },
    err => {
      btn.classList.remove('loading');
      const msg = {
        1: '위치 권한이 거부됐습니다. 브라우저 설정에서 이 사이트의 위치 권한을 허용해주세요.',
        2: '위치를 알 수 없습니다 (GPS·네트워크 확인).',
        3: '위치 요청 시간이 초과됐습니다.',
      }[err.code] || ('위치 가져오기 실패: ' + err.message);
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

function setUserLocation(lat, lng, accuracy) {
  userLatLng = { lat, lng };
  updateCoordDisplay(lat, lng);
  const ll = new naver.maps.LatLng(lat, lng);

  if (userMarker) userMarker.setMap(null);
  if (userCircle) userCircle.setMap(null);

  const crosshairSvg =
    '<svg viewBox="0 0 32 32" width="32" height="32">' +
      '<circle cx="16" cy="16" r="11" fill="white" stroke="#111" stroke-width="2.4"/>' +
      '<line x1="16" y1="1"  x2="16" y2="7"  stroke="#111" stroke-width="2.4" stroke-linecap="round"/>' +
      '<line x1="16" y1="25" x2="16" y2="31" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>' +
      '<line x1="1"  y1="16" x2="7"  y2="16" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>' +
      '<line x1="25" y1="16" x2="31" y2="16" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>' +
      '<circle cx="16" cy="16" r="3.5" fill="#dc2626"/>' +
    '</svg>';

  userMarker = new naver.maps.Marker({
    position: ll,
    map: map,
    icon: {
      content: '<div class="user-loc-marker" title="현재 내 위치">' + crosshairSvg + '</div>',
      anchor: new naver.maps.Point(16, 16),
    },
    zIndex: 1000,
  });

  // GPS 정확도 원 (m 단위 반지름). 50m 미만은 너무 작아 안 그림.
  if (accuracy && accuracy >= 50) {
    userCircle = new naver.maps.Circle({
      map: map,
      center: ll,
      radius: accuracy,
      fillColor: '#3b82f6',
      fillOpacity: 0.08,
      strokeColor: '#3b82f6',
      strokeOpacity: 0.4,
      strokeWeight: 1,
    });
  }

  map.setCenter(ll);
  map.setZoom(Math.max(map.getZoom(), 14));
  renderPlaceList();  // 거리 갱신
}

// Haversine 거리 (미터)
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDistance(m) {
  if (m < 1000) return Math.round(m) + 'm';
  if (m < 10000) return (m / 1000).toFixed(1) + 'km';
  return Math.round(m / 1000) + 'km';
}

/* ----- 헤더 GPS 좌표 표시 + 클릭 복사 ----- */
function updateCoordDisplay(lat, lng) {
  const el = document.getElementById('coord-display');
  document.getElementById('coord-text').textContent =
    lat.toFixed(5) + ', ' + lng.toFixed(5);
  el.classList.add('visible');
}

function bindCoordDisplay() {
  document.getElementById('coord-display').onclick = async () => {
    if (!userLatLng) return;
    const text = userLatLng.lat.toFixed(6) + ', ' + userLatLng.lng.toFixed(6);
    try {
      await navigator.clipboard.writeText(text);
      const el = document.getElementById('coord-display');
      el.classList.add('copied');
      showToast('좌표 복사됨: ' + text + '  (119 신고 시 읽어주세요)');
      setTimeout(() => el.classList.remove('copied'), 1500);
    } catch (e) {
      showToast('복사 실패. ' + text);
    }
  };
}

function showToast(msg, ms) {
  let t = document.getElementById('ddc-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'ddc-toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideT);
  t._hideT = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

/* ----- 조난자 배너 + 가장 가까운 산악표지판 안내 ----- */
function bindRescueBanner() {
  const banner = document.getElementById('rescue-banner');
  // 닫기는 그 화면에서만. 새로고침하면 다시 표시 (저장 안 함).
  document.getElementById('rescue-close').onclick = () => {
    banner.classList.add('hidden');
  };
  document.getElementById('rescue-go').onclick = guideToNearest;
}

function guideToNearest() {
  if (!navigator.geolocation) {
    alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
    return;
  }
  showToast('현재 위치를 받는 중입니다...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      setUserLocation(lat, lng, accuracy);

      // 산악표지판 카테고리에서 가장 가까운 항목 찾기 (없으면 모든 카테고리에서)
      let target = findNearest('산악위치표지판', lat, lng) || findNearest(null, lat, lng);
      if (!target) {
        showToast('지도에 등록된 표지판이 없습니다.');
        return;
      }
      // 활성 카테고리 풀고 그 마커로 줌인 + 팝업
      setActiveCategory(null);
      map.setCenter(new naver.maps.LatLng(target.item.lat, target.item.lng));
      map.setZoom(17);
      setTimeout(() => {
        if (openInfoWindow) openInfoWindow.close();
        const html = buildInfoWindowHtml(target.catKey, target.cat, target.item);
        target.info.setContent(html);
        target.info.open(map, target.marker);
        openInfoWindow = target.info;
      }, 400);
      showToast('가장 가까운 표지판: ' + target.item.name + ' (' + formatDistance(target.distance) + ')', 4000);
    },
    err => {
      alert('위치를 받을 수 없습니다. 브라우저 위치 권한을 허용해주세요.');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
  );
}

function findNearest(catKey, lat, lng) {
  let best = null;
  const lists = catKey
    ? [[catKey, markers[catKey] || []]]
    : Object.entries(markers);
  lists.forEach(([key, list]) => {
    list.forEach(rec => {
      const d = haversine(lat, lng, rec.item.lat, rec.item.lng);
      if (!best || d < best.distance) {
        best = { catKey: key, item: rec.item, cat: rec.cat, marker: rec.marker, info: rec.info, distance: d };
      }
    });
  });
  return best;
}

/* ----- URL 파라미터 처리 (마커 직접 링크, 좌표 공유) ----- */
function handleUrlParams() {
  const params = new URLSearchParams(window.location.search);

  // ?m=마커이름  — 부분 일치, 첫 번째 매치
  const m = params.get('m');
  if (m) {
    const target = findMarkerByName(decodeURIComponent(m));
    if (target) {
      setTimeout(() => {
        map.setCenter(new naver.maps.LatLng(target.item.lat, target.item.lng));
        map.setZoom(17);
        target.info.setContent(buildInfoWindowHtml(target.catKey, target.cat, target.item));
        target.info.open(map, target.marker);
        openInfoWindow = target.info;
      }, 300);
    }
  }

  // ?p=lat,lng — 임시 핀 (조난자/신고자 위치)
  const p = params.get('p');
  if (p) {
    const [lat, lng] = p.split(',').map(Number);
    if (!isNaN(lat) && !isNaN(lng)) {
      const ll = new naver.maps.LatLng(lat, lng);
      const reportMarker = new naver.maps.Marker({
        position: ll,
        map: map,
        icon: {
          content:
            '<div class="user-loc-marker">' +
              '<svg viewBox="0 0 32 32" width="32" height="32">' +
                '<circle cx="16" cy="16" r="11" fill="white" stroke="#dc2626" stroke-width="3"/>' +
                '<circle cx="16" cy="16" r="4" fill="#dc2626"/>' +
              '</svg>' +
            '</div>',
          anchor: new naver.maps.Point(16, 16),
        },
        zIndex: 999,
        title: '공유된 위치',
      });
      map.setCenter(ll);
      map.setZoom(16);
      showToast('공유받은 위치: ' + lat.toFixed(5) + ', ' + lng.toFixed(5), 3500);
    }
  }
}

function findMarkerByName(query) {
  const q = query.toLowerCase();
  let found = null;
  Object.entries(markers).some(([key, list]) =>
    list.some(rec => {
      if (rec.item.name && rec.item.name.toLowerCase().includes(q)) {
        found = { catKey: key, item: rec.item, cat: rec.cat, marker: rec.marker, info: rec.info };
        return true;
      }
      return false;
    })
  );
  return found;
}

/* ----- 좌표 공유 (URL 복사 + Web Share API) ----- */
function shareCoord(lat, lng) {
  const baseUrl = location.origin + location.pathname;
  const url = baseUrl + '?p=' + Number(lat).toFixed(6) + ',' + Number(lng).toFixed(6);
  if (navigator.share) {
    navigator.share({
      title: '동두천시 재난안전지도',
      text: '이 위치로 와주세요',
      url: url,
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(
      () => showToast('위치 링크 복사됨: ' + url, 3000),
      () => prompt('이 링크를 복사하세요:', url),
    );
  }
}
window.shareCoord = shareCoord;  // InfoWindow 안 onclick 에서 호출용

/* ----- 필터 적용 (카테고리 + 검색) ----- */
function applyFilter() {
  if (openInfoWindow) { openInfoWindow.close(); openInfoWindow = null; }
  recomputeClusters();
  renderPlaceList();
}

/* ----- 클러스터링 (자체 격자 기반) ----- */
function getVisibleRecs() {
  const out = [];
  Object.entries(markers).forEach(([key, list]) => {
    list.forEach(rec => {
      const showByCat = !activeCategory || activeCategory === key;
      const showBySearch = !searchQuery || matchSearch(rec.item, rec.cat);
      if (showByCat && showBySearch) out.push(rec);
    });
  });
  return out;
}

function recomputeClusters() {
  // 기존 클러스터 마커 제거
  clusterMarkers.forEach(m => m.setMap(null));
  clusterMarkers = [];

  const zoom = map.getZoom();
  // 줌 15 이상이면 클러스터링 안 함 (개별 마커 그대로)
  const cellSize = zoom <= 11 ? 0.040
                 : zoom === 12 ? 0.020
                 : zoom === 13 ? 0.010
                 : zoom === 14 ? 0.005
                 : 0;  // 15+ 클러스터링 OFF

  const visible = getVisibleRecs();
  const hiddenSet = new Set();   // 클러스터로 흡수된 rec

  if (cellSize > 0) {
    const grid = {};
    visible.forEach(rec => {
      const gx = Math.floor(rec.item.lng / cellSize);
      const gy = Math.floor(rec.item.lat / cellSize);
      const key = gx + ',' + gy;
      (grid[key] = grid[key] || []).push(rec);
    });

    Object.values(grid).forEach(group => {
      if (group.length < 2) return;
      // 그룹 내 마커는 숨기고, 클러스터 한 개 표시
      group.forEach(rec => hiddenSet.add(rec));
      const lat = group.reduce((s, r) => s + r.item.lat, 0) / group.length;
      const lng = group.reduce((s, r) => s + r.item.lng, 0) / group.length;
      const sizeClass = group.length >= 30 ? ' size-xl'
                      : group.length >= 10 ? ' size-l' : '';
      const cluster = new naver.maps.Marker({
        position: new naver.maps.LatLng(lat, lng),
        map: map,
        icon: {
          content: '<div class="cluster-marker' + sizeClass + '">' + group.length + '</div>',
          anchor: new naver.maps.Point(19, 19),
        },
        zIndex: 50,
      });
      naver.maps.Event.addListener(cluster, 'click', () => {
        const z = Math.min(map.getZoom() + 2, 18);
        map.setCenter(new naver.maps.LatLng(lat, lng));
        map.setZoom(z);
      });
      clusterMarkers.push(cluster);
    });
  }

  // 모든 rec 마커 visibility 설정
  Object.values(markers).forEach(list => {
    list.forEach(rec => {
      const show = visible.includes(rec) && !hiddenSet.has(rec);
      rec.marker.setMap(show ? map : null);
    });
  });
}

function matchSearch(item, cat) {
  const q = searchQuery;
  if (!q) return true;
  const fields = [item.name, item.address, item.type, item.note, cat.label];
  return fields.some(f => f && String(f).toLowerCase().includes(q));
}

/* ----- 마커 렌더 ----- */
function renderAllMarkers() {
  Object.entries(CATS).forEach(([key, cat]) => {
    markers[key] = [];
    (cat.items || []).forEach(item => {
      const rec = createMarker(key, cat, item);
      if (rec) markers[key].push(rec);
    });
  });
}

function createMarker(catKey, cat, item) {
  if (typeof item.lat !== 'number' || typeof item.lng !== 'number') return null;
  // SVG 가 있으면 SVG, 없으면 이모지 fallback
  const inner = svgFor(catKey) || '<span class="map-marker-emoji">' + iconFor(catKey) + '</span>';
  const marker = new naver.maps.Marker({
    position: new naver.maps.LatLng(item.lat, item.lng),
    map: map,
    icon: {
      content: '<div class="map-marker" title="' + escapeHtml(item.name) + '">' + inner + '</div>',
      anchor: new naver.maps.Point(16, 16),   // 32×32 마커 박스의 중앙이 좌표를 가리킴
    },
    title: item.name,
  });
  const infoHtml = buildInfoWindowHtml(catKey, cat, item);
  const info = new naver.maps.InfoWindow({
    content: infoHtml,
    borderWidth: 0,
    backgroundColor: '#fff',
    anchorSize: new naver.maps.Size(12, 10),
    pixelOffset: new naver.maps.Point(0, -8),
  });
  naver.maps.Event.addListener(marker, 'click', () => {
    if (openInfoWindow) openInfoWindow.close();
    // userLatLng 가 갱신됐을 수 있으므로 매번 최신 콘텐츠로 다시 빌드 (길찾기 URL 의 출발지 반영)
    info.setContent(buildInfoWindowHtml(catKey, cat, item));
    info.open(map, marker);
    openInfoWindow = info;
  });
  return { marker, info, item, cat };
}

function buildInfoWindowHtml(catKey, cat, item) {
  const rows = [];
  if (item.address) rows.push(row('주소', escapeHtml(item.address)));
  if (item.phone) rows.push(row('전화', '<a href="tel:' + item.phone.replace(/[^0-9]/g,'') + '">' + escapeHtml(item.phone) + '</a>'));
  if (item.type) rows.push(row('종류', escapeHtml(item.type)));
  if (item.capacity) rows.push(row('수용', escapeHtml(String(item.capacity)) + '명'));
  if (item.level) rows.push(row('등급', escapeHtml(item.level)));
  if (item.note) rows.push(row('비고', escapeHtml(item.note)));

  const catLabel = escapeHtml(cat.label || catKey);
  return (
    '<div class="info-window">' +
      '<span class="info-cat" style="background:' + cat.color + '">' +
        '<span class="info-cat-icon">' + iconFor(catKey) + '</span>' + catLabel +
      '</span>' +
      '<div class="info-name">' + escapeHtml(item.name) + '</div>' +
      rows.join('') +
      buildNavButtons(item) +
    '</div>'
  );
  function row(label, val) {
    return '<div class="info-row"><strong>' + label + '</strong><span>' + val + '</span></div>';
  }
}

/* ----- 길찾기 (도보) 버튼 — 모바일 앱 URL Scheme ----- */
function buildNavButtons(item) {
  if (typeof item.lat !== 'number') return '';
  const lat = item.lat, lng = item.lng;
  const name = encodeURIComponent(item.name || '목적지');

  // 네이버맵: 도보 경로
  let nmap = 'nmap://route/walk?dlat=' + lat + '&dlng=' + lng + '&dname=' + name + '&appname=ddc-disaster-map';
  if (userLatLng) {
    nmap += '&slat=' + userLatLng.lat + '&slng=' + userLatLng.lng + '&sname=' + encodeURIComponent('내 위치');
  }

  // 카카오맵: 도보 경로 (ep=목적지, by=FOOT)
  let kakao = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=FOOT';
  if (userLatLng) {
    kakao = 'kakaomap://route?sp=' + userLatLng.lat + ',' + userLatLng.lng +
            '&ep=' + lat + ',' + lng + '&by=FOOT';
  }

  return (
    '<div class="info-nav">' +
      '<a href="' + nmap + '" class="info-nav-btn nav-naver" target="_blank" rel="noopener">🚶 네이버맵</a>' +
      '<a href="' + kakao + '" class="info-nav-btn nav-kakao" target="_blank" rel="noopener">🚶 카카오맵</a>' +
    '</div>' +
    '<button class="info-share-btn" onclick="window.shareCoord(' + lat + ',' + lng + ')">🔗 이 위치 링크 복사·공유</button>'
  );
}

/* ----- 사이드바 장소 목록 (카테고리·검색 필터 적용) ----- */
function renderPlaceList() {
  const wrap = document.getElementById('place-list');
  wrap.innerHTML = '';

  const filtered = [];
  Object.entries(CATS).forEach(([key, cat]) => {
    if (activeCategory && key !== activeCategory) return;
    (cat.items || []).forEach(it => {
      if (typeof it.lat !== 'number') return;
      if (!matchSearch(it, cat)) return;
      const rec = { catKey: key, cat, item: it };
      if (userLatLng) {
        rec.distance = haversine(userLatLng.lat, userLatLng.lng, it.lat, it.lng);
      }
      filtered.push(rec);
    });
  });

  // 내 위치가 있으면 가까운 순으로 정렬
  if (userLatLng) filtered.sort((a, b) => a.distance - b.distance);

  document.getElementById('place-count').textContent = filtered.length;

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-hint">조건에 맞는 장소가 없습니다.</div>';
    return;
  }

  // 카테고리 1개만 선택됐고 region 컬럼이 두 가지 이상이면 region 그룹화
  const regions = new Set(filtered.map(r => (r.item.region || '').trim() || '기타'));
  if (activeCategory && regions.size > 1) {
    renderGroupedByRegion(filtered, wrap);
  } else {
    filtered.forEach(rec => wrap.appendChild(buildPlaceEl(rec)));
  }
}

function renderGroupedByRegion(filtered, wrap) {
  const groups = {};
  filtered.forEach(rec => {
    const region = (rec.item.region || '').trim() || '기타';
    (groups[region] = groups[region] || []).push(rec);
  });

  // 기타는 맨 뒤로
  const ordered = Object.keys(groups).sort((a, b) => {
    if (a === '기타') return 1;
    if (b === '기타') return -1;
    return a.localeCompare(b, 'ko');
  });

  // 접힘 상태 기억 (사이드바 통째로)
  const collapsedKey = 'ddc-collapsed-' + activeCategory;
  const collapsedSet = new Set(JSON.parse(localStorage.getItem(collapsedKey) || '[]'));

  ordered.forEach(region => {
    const recs = groups[region];
    const header = document.createElement('div');
    header.className = 'group-header';
    if (collapsedSet.has(region)) header.classList.add('collapsed');
    header.innerHTML =
      '<span class="group-name">' + escapeHtml(region) + '</span>' +
      '<span class="group-count">' + recs.length + '</span>' +
      '<span class="group-toggle">▾</span>';

    const body = document.createElement('div');
    body.className = 'group-body';
    if (collapsedSet.has(region)) body.classList.add('collapsed');
    recs.forEach(rec => body.appendChild(buildPlaceEl(rec)));

    header.onclick = () => {
      const willCollapse = !header.classList.contains('collapsed');
      header.classList.toggle('collapsed', willCollapse);
      body.classList.toggle('collapsed', willCollapse);
      if (willCollapse) collapsedSet.add(region);
      else collapsedSet.delete(region);
      localStorage.setItem(collapsedKey, JSON.stringify([...collapsedSet]));
    };

    wrap.appendChild(header);
    wrap.appendChild(body);
  });
}

function buildPlaceEl({ catKey, cat, item, distance }) {
  const el = document.createElement('div');
  el.className = 'place-item';
  const distHtml = (typeof distance === 'number')
    ? '<span class="place-distance">' + formatDistance(distance) + '</span>'
    : '';
  el.innerHTML =
    '<div class="place-name-row">' +
      '<div class="place-name">' +
        '<span class="pdot" style="background:' + cat.color + '"></span>' +
        escapeHtml(item.name) +
      '</div>' + distHtml +
    '</div>' +
    (item.address ? '<div class="place-addr">' + escapeHtml(item.address) + '</div>' :
     item.note    ? '<div class="place-addr">' + escapeHtml(item.note) + '</div>' : '');
  el.onclick = () => {
    map.setCenter(new naver.maps.LatLng(item.lat, item.lng));
    map.setZoom(Math.max(map.getZoom(), 15));
    const rec = (markers[catKey] || []).find(r => r.item === item);
    if (rec) {
      if (openInfoWindow) openInfoWindow.close();
      rec.info.open(map, rec.marker);
      openInfoWindow = rec.info;
    }
  };
  return el;
}

/* ----- 유틸 ----- */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ----- 부팅 ----- */
window.addEventListener('load', initMap);
