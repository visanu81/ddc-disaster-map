name: Deploy to GitHub Pages

# 트리거:
# - push: 사장님이 갱신.bat 으로 시트 데이터를 푸시할 때
# - schedule: 매시간 cron 으로 기상·산림·하천 위험도 자동 갱신
# - workflow_dispatch: 수동 실행

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'        # 매시간 정각 (UTC 기준이지만 콘텐츠 갱신엔 무관)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Update weather/fire/river data
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          HRFCO_KEY: ${{ secrets.HRFCO_KEY }}
        run: python tools/update_weather.py
        continue-on-error: true   # API 일시 장애시에도 배포는 계속

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
