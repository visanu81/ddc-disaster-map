name: Auto Update Weather

# 매시간 정각 기상·산림·하천 위험도를 새로 받아서 weather.js 를 갱신·push.
# 배포는 Cloudflare Pages 가 git push 를 감지해 자동으로 처리 (이 워크플로우는 데이터 갱신만 담당).
#
# 2026-06-18: 사장님 요청으로 cron 일시 정지 (GitHub Actions 2000분/월 한도 소진).
# 한도 리셋 후(7월 1일) 다시 켤 때 schedule 줄 주석만 풀면 됨.

on:
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run weather collection
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          HRFCO_KEY: ${{ secrets.HRFCO_KEY }}
        run: python tools/update_weather.py
        continue-on-error: true

      - name: Run sheet sync (marker data)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
          HRFCO_KEY: ${{ secrets.HRFCO_KEY }}
        run: python tools/update_places.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git add weather.js data.js || true
          if ! git diff --cached --quiet; then
            git commit -m "자동 갱신 $(date '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
