name: Auto Update Weather

# 매시간 정각 기상·산림·하천 위험도를 새로 받아서 weather.js 를 갱신·push.
# 배포는 Cloudflare Pages 가 git push 를 감지해 자동으로 처리 (이 워크플로우는 데이터 갱신만 담당).

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run weather collection
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          HRFCO_KEY: ${{ secrets.HRFCO_KEY }}
        run: python tools/update_weather.py

      - name: Commit and push if changed
        run: |
          git add weather.js || true
          if ! git diff --cached --quiet; then
            git commit -m "기상 자동 갱신 $(date '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No weather changes to commit."
          fi
